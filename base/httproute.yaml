apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: java-demo
spec:
  parentRefs:
    - name: lab-gateway
      namespace: infra-gateway
      sectionName: https
  hostnames:
    - java.samsungsdsvn.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: java-demo
          port: 80
